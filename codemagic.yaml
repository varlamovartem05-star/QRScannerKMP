workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
    scripts:
      - name: Install dependencies
        script: |
          pip install pyyaml
      - name: Build iOS Framework
        script: |
          chmod +x gradlew
          ./gradlew tasks
      - name: Xcode build
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
    artifacts:
      - iosApp/build/Products/Debug-iphoneos/*.app
    publishing:
      email:
        recipients:
          - varlamovartem05@gmail.com
